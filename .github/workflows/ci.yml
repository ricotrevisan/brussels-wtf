name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brussels
          POSTGRES_PASSWORD: brussels
          POSTGRES_DB: brussels_wtf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brussels -d brussels_wtf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: brussels
      PGPASSWORD: brussels

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-otp28-elixir1.19.5-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-otp28-elixir1.19.5-mix-

      - name: Install PDF citation verifier
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: mix deps.get --only test
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - name: Prepare quota-backed OCR integration workspace
        run: |
          workspace="${RUNNER_TEMP}/large-pdf-ocr-scratch"
          mkdir -p "$workspace"
          sudo mount -t tmpfs -o "size=512m,mode=0700,uid=$(id -u),gid=$(id -g),nosuid,nodev,noexec" tmpfs "$workspace"
          printf 'OCR_TEST_WORKSPACE=%s\n' "$workspace" >> "$GITHUB_ENV"
      - run: mix test
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('test/browser/uv.lock') }}
      - name: Install Playwright Chromium
        run: uv sync --project test/browser --frozen && uv run --project test/browser --frozen playwright install --with-deps chromium
      - name: Run browser tests
        run: mix test.browser
      - name: Unmount OCR integration workspace
        if: always()
        run: |
          workspace="${RUNNER_TEMP}/large-pdf-ocr-scratch"
          if mountpoint -q "$workspace"; then sudo umount "$workspace"; fi
