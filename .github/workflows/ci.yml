name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brussels
          POSTGRES_PASSWORD: brussels
          POSTGRES_DB: brussels_wtf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brussels -d brussels_wtf_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: brussels
      PGPASSWORD: brussels

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install PDF citation verifier
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: mix deps.get --only test
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
      - name: Install Playwright Chromium
        run: uv sync --project test/browser --frozen && uv run --project test/browser --frozen playwright install --with-deps chromium
      - name: Run browser tests
        run: mix test.browser
