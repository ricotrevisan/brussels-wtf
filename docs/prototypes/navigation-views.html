<title>PROTOTYPE · brussels.wtf navigation views</title>
<!--
  PROTOTYPE, throwaway. Question: how should readers navigate by commune, by topic or by meeting?
  Four structurally different views over the real published EN content (23 meetings, 486 items,
  scraped from brussels.wtf on 2026-11-04). Switch with the bar, ?variant=A..D, or the arrow keys.
  Topics are a keyword guess made in this file only: the app has no topic data yet.
-->
<style>
  :root { --y: #FFCC00; --fg: var(--foreground, #16181d); --mut: var(--muted-foreground, #5b6170);
          --bd: var(--border, #dfe2e8); --card2: var(--card, #fff); --sec: var(--secondary, #f2f3f6);
          --ok: var(--success, #1f8a4c); --bad: var(--destructive, #c2372f); --warn: var(--warning, #b7791f);
          --r: var(--radius, 10px); }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--fg); font-family: var(--font-sans, system-ui, sans-serif); font-size: 15px; line-height: 1.45; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .muted { color: var(--mut); }
  .small { font-size: 13px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .o-approved { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .o-rejected { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .o-unknown { background: var(--sec); color: var(--mut); }
  .o-other { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .ctag { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .c-ixelles { --c: #e4572e; } .c-uccle { --c: #2e86ab; } .c-forest { --c: #3f9a52; } .c-city-of-brussels { --c: #8e44ad; }
  .dot.c, .c .dot { background: var(--c); }
  .item { border-top: 1px solid var(--bd); }
  .item > button { all: unset; box-sizing: border-box; display: grid; gap: 4px; width: 100%; padding: 10px 2px; cursor: pointer; }
  .item > button:focus-visible { outline: 2px solid var(--ring, #888); }
  .item .detail { display: none; padding: 0 2px 12px; }
  .item.open .detail { display: block; }
  .vote { display: flex; height: 6px; border-radius: 3px; overflow: hidden; width: 120px; background: var(--sec); }
  .vote i { display: block; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  h1, h2, h3 { margin: 0; line-height: 1.2; }
  .switch { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 16px; padding: 6px; border-radius: 999px;
            background: #111; color: #fff; font-size: 13px; position: sticky; top: 4px; z-index: 5; box-shadow: 0 2px 10px #0003; }
  .switch button { background: #333; border: 0; border-radius: 999px; width: 30px; height: 30px; color: #fff; }
  .switch b { color: var(--y); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--bd); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--background, #fff); border-color: var(--fg); }
  .note { font-size: 12px; color: var(--mut); border-left: 3px solid var(--y); padding-left: 8px; margin: 10px 0 16px; }

  /* A: commune desks */
  .A-tabs { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; }
  .A-tab { border: 1px solid var(--bd); background: transparent; border-radius: var(--r); padding: 10px; text-align: left; border-top: 4px solid var(--c); }
  .A-tab[aria-selected="true"] { background: color-mix(in srgb, var(--c) 10%, transparent); border-color: var(--c); }
  .A-tab strong { display: block; font-size: 15px; }
  .A-hero { margin-top: 16px; border-radius: var(--r); padding: 16px; background: color-mix(in srgb, var(--c) 9%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .A-cols { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 18px; }
  .A-meet { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--bd); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
  .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--sec); width: 80px; }
  @media (max-width: 640px) { .A-tabs { grid-template-columns: repeat(2, minmax(0,1fr)); } .A-cols { grid-template-columns: 1fr; } }

  /* B: topic explorer */
  .B-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .B-tile { border: 1px solid var(--bd); background: transparent; border-radius: var(--r); padding: 12px; text-align: left; min-height: 92px; display: grid; align-content: space-between; gap: 8px; }
  .B-tile[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); background: var(--sec); }
  .B-tile .n { font-size: 26px; font-weight: 700; line-height: 1; }
  .B-mix { display: flex; height: 5px; border-radius: 3px; overflow: hidden; }
  .B-mix i { display: block; background: var(--c); }
  .B-date { position: sticky; top: 46px; background: var(--background, #fff); padding: 8px 0 4px; font-weight: 700; font-size: 13px; z-index: 1; }

  /* C: council calendar */
  .C-scroll { overflow-x: auto; border: 1px solid var(--bd); border-radius: var(--r); }
  .C-mx { border-collapse: collapse; min-width: 640px; width: 100%; font-size: 12px; }
  .C-mx th, .C-mx td { border-bottom: 1px solid var(--bd); padding: 6px 4px; text-align: center; }
  .C-mx th:first-child, .C-mx td:first-child { text-align: left; position: sticky; left: 0; background: var(--background, #fff); padding-left: 10px; white-space: nowrap; }
  .C-cell { border: 0; background: none; padding: 0; }
  .C-bub { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; font-size: 11px; background: var(--c); }
  .C-bub[aria-pressed="true"] { outline: 3px solid var(--y); outline-offset: 2px; }
  .C-sheet { margin-top: 18px; border: 1px solid var(--bd); border-radius: var(--r); padding: 14px; }
  .C-row { display: grid; grid-template-columns: 34px 26px 1fr; gap: 8px; align-items: start; }
  .C-mark { font-weight: 800; text-align: center; }
  .C-toc { columns: 2 260px; column-gap: 24px; }
  .C-t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item.open .C-t { -webkit-line-clamp: unset; }
  .C-toc .item { break-inside: avoid; }

  /* D: ledger */
  .D-bar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .D-q { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: var(--r); border: 2px solid var(--fg); background: transparent; color: inherit; }
  .seg { display: inline-flex; border: 1px solid var(--bd); border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--y); color: #111; font-weight: 700; }
  .D-group > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 2px solid var(--fg); font-weight: 700; }
  .D-group > summary::-webkit-details-marker { display: none; }
  .D-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; }
  @media (max-width: 640px) { .D-bar { grid-template-columns: 1fr; } .D-row { grid-template-columns: 1fr auto; } .D-row .hide-s { display: none; } .D-row { grid-template-columns: 1fr; } }
</style>

  return `<h1 style="font-size:26px">What is being decided, by subject</h1><p class="muted" style="margin:4px 0 14px">Start from what you care about. Follow it across all four communes.</p>
  <div class="B-grid">${counts.map(x => `<button class="B-tile" aria-pressed="${x.t === topic}" data-b-t="${esc(x.t)}"><span style="font-weight:600">${esc(x.t)}</span>
    <span><span class="n">${x.n}</span><span class="small muted"> items</span><span class="B-mix" style="margin-top:6px">${x.per.map((n, k) => `<i class="c-${Object.keys(COMMUNES)[k]}" style="flex:${n}"></i>`).join("")}</span></span></button>`).join("")}</div>
  <p class="note">Topics here are guessed from keywords for the prototype. A real version needs a reviewed topic per item.</p>
  <div class="meta" style="justify-content:space-between;margin:6px 0"><h2 style="font-size:20px">${esc(topic)} <span class="muted" style="font-weight:400">· ${its.length}</span></h2>
    <div class="chips">${Object.entries(COMMUNES).map(([k, n]) => `<button class="chip c-${k}" aria-pressed="${s.c.has(k)}" data-b-c="${k}"><span class="dot c"></span> ${n}</button>`).join("")}</div></div>
  ${Object.entries(byDate).slice(0, 6).map(([d, l]) => `<div class="B-date">${fmt(d)} <span class="muted" style="font-weight:400">· ${l.length}</span></div>${l.slice(0, 5).map(i => itemRow(i, { date: false })).join("")}${l.length > 5 ? `<p class="small muted" style="margin:4px 0 10px">+ ${l.length - 5} more from this meeting</p>` : ""}`).join("")}
  ${Object.keys(byDate).length > 6 ? `<p class="small muted">… ${Object.keys(byDate).length - 6} earlier meetings</p>` : ""}`;
}

/* C: Council calendar. Meeting first, as a commune-by-month grid, then a ballot sheet. */
function C() {
  const s = state.C;
  const months = [...new Set(meetings.map(m => m.d.slice(0, 7)))].sort();
  const cur = meetings.find(m => m.c + m.m === (s.m || "ixelles265"));
  const cell = (c, mo) => meetings.filter(m => m.c === c && m.d.startsWith(mo)).map(m => {
    const z = Math.max(18, Math.min(40, 12 + Math.sqrt(m.items.length) * 3.4));
    return `<button class="C-cell" title="${COMMUNES[c]} ${fmt(m.d)}: ${m.items.length} points"><span class="C-bub c-${c}" style="width:${z}px;height:${z}px;${m.decided ? "" : "opacity:.55"}" aria-pressed="${m.c + m.m === cur.c + cur.m}" data-c-m="${m.c + m.m}">${m.items.length}</span></button>`;
  }).join("");
  const mark = o => o === "approved" ? `<span class="C-mark" style="color:var(--ok)">✓</span>` : o === "rejected" ? `<span class="C-mark" style="color:var(--bad)">✗</span>` : o === "unknown" ? `<span class="C-mark muted">?</span>` : `<span class="C-mark" style="color:var(--warn)">•</span>`;
  return `<h1 style="font-size:26px">Council calendar</h1><p class="muted" style="margin:4px 0 14px">Every covered meeting, by commune and month. Bubble size is the number of points; faded means no decisions documented yet.</p>
  <div class="C-scroll"><table class="C-mx"><thead><tr><th></th>${months.map(mo => `<th>${new Date(mo + "-15").toLocaleDateString("en-GB", { month: "short" })}<br><span class="muted">${mo.slice(2, 4)}</span></th>`).join("")}</tr></thead>
  <tbody>${Object.entries(COMMUNES).map(([c, n]) => `<tr><td class="c-${c}"><span class="dot c"></span> ${n}</td>${months.map(mo => `<td>${cell(c, mo)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <section class="C-sheet c-${cur.c}"><div class="meta" style="justify-content:space-between"><div><span class="ctag"><span class="dot c"></span> ${COMMUNES[cur.c]}</span>
    <h2 style="font-size:22px;margin-top:4px">${fmt(cur.d)} · ${cur.items.length} points</h2></div>
    <span class="small muted">✓ ${cur.items.filter(i => i.o === "approved").length} &nbsp; ✗ ${cur.items.filter(i => i.o === "rejected").length} &nbsp; ? ${cur.items.filter(i => i.o === "unknown").length}</span></div>
    <p class="note">Read like the council's own agenda: numbered, in order, with the result in the margin.</p>
    <div class="C-toc">${cur.items.slice(0, 24).map(i => `<div class="item"><button><span class="C-row"><span class="small muted">${esc(i.n)}</span>${mark(i.o)}<span><span class="C-t">${esc(i.t)}</span>${contested(i) ? ` <span class="pill o-other">${i.v.join("–")}</span>` : ""}</span></span></button>
      <div class="detail"><p style="margin:0 0 6px">${esc(i.p)}</p><a class="small" href="${url(i)}" target="_blank">Sources ↗</a></div></div>`).join("")}</div>${cur.items.length > 24 ? `<p class="small" style="margin:10px 0 0"><a href="https://brussels.wtf/meetings/${cur.c}/${cur.m}?lang=en" target="_blank">All ${cur.items.length} points ↗</a></p>` : ""}</section>`;
}

/* D: Ledger. Search first; commune, topic and meeting are three pivots of one list. */
function D() {
  const s = state.D;
  const q = s.q.trim().toLowerCase();
  const its = items.filter(i => (!q || (i.t + " " + i.p).toLowerCase().includes(q)) && (s.o === "all" || (s.o === "decided" ? i.o !== "unknown" : s.o === "contested" ? contested(i) : i.o === "unknown")));
  const key = { commune: i => [COMMUNES[i.c]], topic: i => i.topics, meeting: i => [`${COMMUNES[i.c]} · ${fmt(i.d)}`] }[s.g];
  const groups = {}; its.forEach(i => key(i).forEach(k => (groups[k] ||= []).push(i)));
  const order = Object.entries(groups).sort((a, b) => s.g === "meeting" ? b[1][0].d.localeCompare(a[1][0].d) : b[1].length - a[1].length);
  const seg = (name, val, opts) => `<span class="seg" role="group" aria-label="${name}">${opts.map(([k, l]) => `<button data-d-${name}="${k}" aria-pressed="${val === k}">${l}</button>`).join("")}</span>`;
  return `<div class="D-bar"><input class="D-q" id="dq" type="search" placeholder="Search 486 council items: school, parking, Atelier…" value="${esc(s.q)}" aria-label="Search council items">
    <span class="small muted">${its.length} items · ${order.length} groups</span></div>
  <div class="meta" style="margin:10px 0 18px">Group by ${seg("g", s.g, [["commune", "Commune"], ["topic", "Topic"], ["meeting", "Meeting"]])}
    ${seg("o", s.o, [["all", "All"], ["decided", "Decided"], ["contested", "Contested"], ["open", "Not documented"]])}</div>
  ${order.slice(0, 12).map(([k, l], n) => `<details class="D-group" ${n < 2 ? "open" : ""}><summary><span>${esc(k)}</span><span class="muted">${l.length}</span></summary>
    ${l.slice(0, 6).map(i => `<div class="item"><button><span class="D-row"><span><span class="small muted">${s.g === "meeting" ? "#" + esc(i.n) : COMMUNES[i.c] + " · " + fmt(i.d)}</span><br><b style="font-weight:600">${esc(i.t)}</b></span>
      <span class="hide-s meta">${vote(i.v)}</span>${outcome(i.o)}</span></button><div class="detail"><p style="margin:0 0 6px">${esc(i.p)}</p><a class="small" href="${url(i)}" target="_blank">Sources ↗</a></div></div>`).join("")}
    ${l.length > 6 ? `<p class="small muted">+ ${l.length - 6} more</p>` : ""}</details>`).join("") || `<p class="muted">No items match. An empty result does not mean the council did nothing.</p>`}`;
}

const VARIANTS = { A: ["Commune desks", A], B: ["Topic explorer", B], C: ["Council calendar", C], D: ["Search ledger", D] };
const keys = Object.keys(VARIANTS);
let v = new URLSearchParams(location.search).get("variant") || location.hash.slice(1) || "A";
if (!VARIANTS[v]) v = "A";
function render() {
  document.getElementById("label").innerHTML = `<b>${v}</b> ${VARIANTS[v][0]} <span style="opacity:.6">(${keys.indexOf(v) + 1}/${keys.length})</span>`;
  document.getElementById("app").innerHTML = VARIANTS[v][1]();
  const dq = document.getElementById("dq");
  if (dq) { dq.oninput = () => { state.D.q = dq.value; const p = dq.selectionStart; render(); const n = document.getElementById("dq"); n.focus(); n.setSelectionRange(p, p); }; }
}
function go(step) {
  v = keys[(keys.indexOf(v) + step + keys.length) % keys.length];
  try { const u = new URL(location.href); u.searchParams.set("variant", v); history.replaceState(null, "", u); } catch (_) { location.hash = v; }
  render();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1);
});
document.getElementById("app").addEventListener("click", e => {
  const t = e.target.closest("[data-a-c],[data-a-m],[data-b-t],[data-b-c],[data-c-m],[data-d-g],[data-d-o]"); if (!t) return;
  const d = t.dataset;
  if (d.aC) { state.A.c = d.aC; state.A.m = null; }
  if (d.aM) state.A.m = d.aM;
  if (d.bT) state.B.t = d.bT;
  if (d.bC) state.B.c.has(d.bC) ? state.B.c.delete(d.bC) : state.B.c.add(d.bC);
  if (d.cM) state.C.m = d.cM;
  if (d.dG) state.D.g = d.dG;
  if (d.dO) state.D.o = d.dO;
  render();
});
render();
</script>
